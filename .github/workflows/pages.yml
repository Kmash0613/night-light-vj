name: Deploy MIDI Monitor to Pages

on:
  push:
    branches:
      - main
      - claude/attachment-project-start-0w3pmp
    paths:
      - "midi-monitor/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload midi-monitor/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: midi-monitor

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
